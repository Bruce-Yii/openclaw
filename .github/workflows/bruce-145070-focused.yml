name: Bruce 145070 Focused Proof

on:
  push:
    branches:
      - fix/doctor-systemd-final-revalidation

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager.split('+')[0]")" --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused red/green regression
        run: node scripts/run-vitest.mjs src/flows/doctor-health.systemd-revalidation.test.ts
